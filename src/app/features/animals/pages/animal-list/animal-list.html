<div class="container mt-3">
  @if (authService.currentUser()) {
    <a class="btn btn-primary mb-3" routerLink="/animals/new">Nuevo</a>
  }
  @if (loading()) {
    <div class="container text-center alert alert-info"><p>Cargando...</p></div>
  } @else if (error()) {
    <div class="container text-center alert alert-danger"><p>{{error()}}</p></div>
  } @else {
    <table class="table table-responsive table-hover table-info">
    <thead>
      <tr>
        <th>ID</th>
        <th>Animal</th>
        <th>Dieta</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (animal of animals(); track animal.id) {
        <tr>
          <td>{{animal.id}}</td>
          <td>{{animal.fullDesc}}</td>
          <td>{{animal.diet}}</td>
          <td><a class="btn btn-primary" [routerLink]="[animal.id]">Ver</a></td>
        </tr>
      }
    </tbody>
  </table>
  }
</div>
