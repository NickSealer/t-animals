<div class="container py-3 bg-light-subtle">
  @if (error()) {
    <div class="container text-center alert alert-danger"><p>{{error()}}</p></div>
  }
  <form (submit)="onSubmit()" [formGroup]="loginForm">
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" class="form-control" formControlName="email">
      @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
        <small class="text-danger">Email obligatorio</small>
      }
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Contraseña</label>
      <input type="password" id="password" class="form-control" formControlName="password">
      @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
        <small class="text-danger">Contraseña obligatoria</small>
      }
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || isSubmitting()">Login</button>
  </form>
</div>
