<div class="mt-3 bg-light py-3">
  <h1 class="text-center">Calculadora</h1>
  <p>Ingresa 2 valores y usa el botón para ver el resultado</p>
  <div class="card">
    <div class="d-flex mx-auto w-10">
      <div class="mb-3 m-1">
        <label for="val1" class="form-label">Valor 1:</label>
        <input type="text" id="val1" name="val1" class="form-control" [(ngModel)]="val1">
      </div>
      <div class="mb-3 m-1">
        <label for="val2" class="form-label">Valor 2:</label>
        <input type="text" id="val2" name="val2" class="form-control" [(ngModel)]="val2">
      </div>
    </div>

    <div class="mt-3 d-flex justify-content-center mx-auto">
      <button type="button" class="btn btn-primary m-1" (click)="add()">Suma</button>
      <button type="button" class="btn btn-primary m-1" (click)="minus()">Resta</button>
      <button type="button" class="btn btn-primary m-1" (click)="divide()">Division</button>
      <button type="button" class="btn btn-primary m-1" (click)="multiply()">Multiplicacion</button>
      <button type="button" class="btn btn-primary m-1" (click)="potencia()">Potencia</button>
      <button type="button" class="btn btn-danger m-1" (click)="reset()">Reset</button>
    </div>

    
  </div>
  <div class="text-center py-3 mt-3 alert alert-success">
    Resultado de la operacion: {{result}}
  </div>
</div>
